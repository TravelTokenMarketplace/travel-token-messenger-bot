name: Publish Docker image to GHCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_latest:
        description: 'Also tag the image as latest'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  push_to_ghcr:
    name: Push Docker image to GitHub Container Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate Docker image tags
        id: meta
        env:
          TAG_LATEST: ${{ inputs.tag_latest }}
        run: |
          # Convert repository to lowercase for docker image name
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_LOWER}"
          
          REF_NAME="${GITHUB_REF_NAME}"
          REF_NAME_CLEAN="${REF_NAME//\//-}"
          TAGS="${IMAGE_NAME}:${REF_NAME_CLEAN}"
          
          if [ "${TAG_LATEST}" = "true" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            TTM_BOT_COMMIT=${{ github.sha }}
            TTM_BOT_TAG=${{ github.ref_name }}
