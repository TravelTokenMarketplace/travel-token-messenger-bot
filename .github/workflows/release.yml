name: Publish Release Artifcats

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Publish Artifcats
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"

      - name: Install libolm
        run: sudo apt update && sudo apt-get install -y libolm-dev

      - name: Build
        run: ./scripts/build.sh

      - name: upload release assets
        run: |
          cp ./build/travel-token-messenger-bot ./travel-token-messenger-bot
          tar -zcvf travel-token-messenger-bot-linux-amd64-${{ github.event.release.tag_name }}.tar.gz ./travel-token-messenger-bot
          gh release upload ${{ github.event.release.tag_name }} travel-token-messenger-bot-linux-amd64-${{ github.event.release.tag_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
        shell: bash
