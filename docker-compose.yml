version: "3"
services:
  bot:
    image: travel-token-messenger-bot
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./ttm-config:/ttm-config
    ports:
      - "9090:9090"
    command: ["--config", "/ttm-config/config.yaml"]
  provider-plugin:
    image: travel-token-messenger-bot-plugin
    build:
      context: .
      dockerfile: Dockerfile.plugin
      args:
        port: 50052
    ports:
      - "50052:50052"
